<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rayando - Juego de dibujo venezolano multijugador en tiempo real">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rayando">

  <title>Rayando 🇻🇪 — Juego de Dibujo</title>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1A1A2E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #1A1A2E;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      color: #FFFFFF;
      user-select: none;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #FF5722 0%, #FFD600 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .flag {
      font-size: 38px;
      line-height: 1;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #FFD600;
      border-right: 4px solid #1E88E5;
      border-bottom: 4px solid #F44336;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      margin-top: 12px;
    }

    .loading-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 16px;
      font-weight: 600;
      margin-top: 6px;
    }

    .tagline {
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      margin-top: -2px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">Rayando</div>
    <div class="flag">🇻🇪</div>
    <div class="spinner"></div>
    <div class="loading-text">Cargando lienzo criollo...</div>
    <div class="tagline">¡Paciencia pana, ya casi está listo!</div>
  </div>

  <script>
    function removeSplash() {
      const splash = document.getElementById('splash');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
        setTimeout(() => {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 450);
      }
    }

    // 1. Listen for Flutter engine first frame
    window.addEventListener('flutter-first-frame', function () {
      removeSplash();
    });

    // 2. Observer fallback in case flutter-view attaches
    const observer = new MutationObserver(function (mutations, obs) {
      const view = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
      if (view) {
        // Wait a slight tick for canvas paint
        setTimeout(removeSplash, 100);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Absolute safety timeout
    setTimeout(removeSplash, 15000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
